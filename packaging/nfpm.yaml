# The deb, rpm and apk packages. nfpm builds all three from the static binary
# for one architecture; scripts/package.sh runs it once per architecture with
# HAWSER_VERSION and HAWSER_ARCH set and the binary staged at release/stage/hawser.
#
#   nfpm package --config packaging/nfpm.yaml --packager deb --target release/
name: hawser
arch: ${HAWSER_ARCH}
platform: linux
version: ${HAWSER_VERSION}
section: net
priority: optional
maintainer: The Hawser Authors
description: |
  A private network between your own machines.
  Each machine gets a fixed address, and every machine knows how to find the
  others by address and by name, wherever they are. WireGuard in the Linux
  kernel carries the traffic; hawser hands out the addresses and the paths.
vendor: Agent3 Labs
homepage: https://github.com/agent3-labs/hawser
license: Apache-2.0
contents:
  - src: release/stage/hawser
    dst: /usr/bin/hawser
    file_info:
      mode: 0755
  - src: packaging/hawser.service
    dst: /lib/systemd/system/hawser.service
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/hawser/LICENSE
    file_info:
      mode: 0644
  - src: NOTICE
    dst: /usr/share/doc/hawser/NOTICE
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/hawser/README.md
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/postinstall.sh
  postremove: packaging/postremove.sh
